[package]
name = "scriptchecker"
version = "0.1.21"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "scriptchecker"
path = "src/lib.rs"

[[bin]]
name = "scriptchecker"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
eframe = "0.31"
hound = "3.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
